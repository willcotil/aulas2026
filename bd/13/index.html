let cur = 0;

function render() {
    const total = steps.length;
    const s = steps[cur];
    document.getElementById('step-counter').textContent = `${cur + 1} / ${total}`;
    document.getElementById('progress-bar').style.width = `${((cur + 1) / total) * 100}%`;
    document.getElementById('btn-prev').disabled = cur === 0;
    document.getElementById('btn-next').innerHTML = cur === total - 1
        ? 'FINALIZAR <i class="fas fa-check-circle ml-2"></i>'
        : 'AVANÇAR <i class="fas fa-arrow-right ml-2"></i>';
    document.getElementById('steps-container').innerHTML = `
        <div class="step-content active">
            <h2 class="no-print text-3xl md:text-4xl font-black mb-8 text-brand-dark border-l-8 border-brand-secondary pl-4">${s.title}</h2>
            <div>${s.content}</div>
        </div>`;
}

function nextStep() { if (cur < steps.length - 1) { cur++; render(); } }
function prevStep() { if (cur > 0) { cur--; render(); } }
function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
    else if (e.key === 'ArrowLeft') prevStep();
});

window.onbeforeprint = function () {
    let html = '';
    steps.forEach((s, i) => {
        html += `<div class="step-content block mb-10 border-b-2 pb-8">
            <h2 class="text-2xl font-black mb-4 border-l-8 border-brand-secondary pl-4">${i + 1}. ${s.title}</h2>
            <div>${s.content}</div>
        </div>`;
    });
    document.getElementById('steps-container').innerHTML = html;
};
window.onafterprint = render;

render();
</script>
